<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSit Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(24, 227, 227, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(41, 101, 101, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-black">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Connection -->
        <header class="glass rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-cyan-400">SmartSit Dashboard</h1>
                <p id="connectionStatus" class="text-xs text-slate-400 mt-1">Status: Disconnected</p>
            </div>
            <div class="flex gap-3">
                <button id="connectBtn" onclick="connectBLE()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-cyan-500/20 text-sm">
                    Connect BLE
                </button>
                <button id="disconnectBtn" onclick="disconnectBLE()" class="hidden bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 font-semibold px-5 py-2.5 rounded-xl transition-all text-sm">
                    Disconnect
                </button>
            </div>
        </header>

        <!-- Control Panel -->
        <section class="glass rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-widest text-cyan-400">Device Controls</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button onclick="sendCommand({c: 'CFG'})" class="bg-slate-900/60 hover:bg-cyan-500/10 border border-slate-800 hover:border-cyan-500/40 p-3 rounded-xl text-sm transition-all text-slate-200">
                    Get Config
                </button>
                <button onclick="sendCommand({c: 'LOGS'})" class="bg-slate-900/60 hover:bg-cyan-500/10 border border-slate-800 hover:border-cyan-500/40 p-3 rounded-xl text-sm transition-all text-slate-200">
                    Get Logs
                </button>
                <button onclick="syncTime()" class="bg-slate-900/60 hover:bg-cyan-500/10 border border-slate-800 hover:border-cyan-500/40 p-3 rounded-xl text-sm transition-all text-slate-200">
                    Sync Time
                </button>
                <button onclick="clearConsole()" class="bg-slate-900/60 hover:bg-rose-500/10 border border-slate-800 hover:border-rose-500/40 p-3 rounded-xl text-sm transition-all text-slate-200">
                    Clear Console
                </button>
            </div>
        </section>

        <!-- Data Output Windows -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Config View -->
            <div class="glass rounded-2xl p-6 shadow-xl flex flex-col h-80">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-cyan-400 mb-3">Configuration</h2>
                <pre id="configOutput" class="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl flex-1 overflow-auto text-xs text-slate-300 font-mono">No config loaded...</pre>
            </div>

            <!-- Logs / Live Output Stream -->
            <div class="glass rounded-2xl p-6 shadow-xl flex flex-col h-80">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-cyan-400 mb-3">Activity Stream</h2>
                <div id="logsOutput" class="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl flex-1 overflow-auto text-xs text-slate-300 font-mono space-y-1">
                    <div class="text-slate-500">Waiting for data stream...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let bleBuffer = "";

        const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Browser writes here
        const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Browser reads/notifies here

        async function connectBLE() {
            try {
                document.getElementById('connectionStatus').innerText = "Status: Requesting Bluetooth Device...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "Smart" }, { namePrefix: "SmartSit" }],
                    optionalServices: [NUS_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(NUS_SERVICE_UUID);

                rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
                txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                document.getElementById('connectionStatus').innerText = `Status: Connected to ${bluetoothDevice.name}`;
                document.getElementById('connectBtn').classList.add('hidden');
                document.getElementById('disconnectBtn').classList.remove('hidden');
                appendLog("System", "BLE Connected Successfully.");
            } catch (error) {
                console.error("Connection failed:", error);
                document.getElementById('connectionStatus').innerText = "Status: Connection Failed / Cancelled";
            }
        }

        function disconnectBLE() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            onDisconnected();
        }

        function onDisconnected() {
            document.getElementById('connectionStatus').innerText = "Status: Disconnected";
            document.getElementById('connectBtn').classList.remove('hidden');
            document.getElementById('disconnectBtn').classList.add('hidden');
            bluetoothDevice = null;
            rxCharacteristic = null;
            txCharacteristic = null;
            appendLog("System", "BLE Disconnected.");
        }

        // Chunk Buffer Assembly
        function handleNotifications(event) {
            const value = event.target.value;
            const chunk = new TextDecoder('utf-8').decode(value);
            
            bleBuffer += chunk;
            
            let newlineIndex;
            while ((newlineIndex = bleBuffer.indexOf('\n')) !== -1) {
                const completeMessage = bleBuffer.slice(0, newlineIndex);
                bleBuffer = bleBuffer.slice(newlineIndex + 1);
                
                try {
                    const packet = JSON.parse(completeMessage);
                    processPacket(packet);
                } catch (e) {
                    console.error("Malformed JSON received:", completeMessage);
                }
            }
            
            if (bleBuffer.length > 512) {
                bleBuffer = ""; // Prevent buffer overflow if malformed
            }
        }

        function processPacket(packet) {
            console.log("Parsed Packet:", packet);
            if (packet.type === "CFG") {
                document.getElementById('configOutput').innerText = JSON.stringify(packet.data, null, 2);
                appendLog("RX", "Configuration updated.");
            } else if (packet.type === "LOGS") {
                document.getElementById('logsOutput').innerHTML = "";
                if (packet.data.logs && Array.isArray(packet.data.logs)) {
                    packet.data.logs.forEach(log => {
                        appendLog(log.type || "LOG", JSON.stringify(log));
                    });
                } else {
                    appendLog("LOGS", JSON.stringify(packet.data, null, 2));
                }
            } else if (packet.type === "ACK") {
                appendLog("ACK", "Command acknowledged by device.");
            }
        }

        async function sendCommand(cmdObj) {
            if (!rxCharacteristic) {
                alert("Please connect to the device via BLE first.");
                return;
            }
            try {
                const jsonStr = JSON.stringify(cmdObj) + "\n";
                const encoder = new TextEncoder();
                
                // Write in chunks if needed or send direct if payload is small
                await rxCharacteristic.writeValue(encoder.encode(jsonStr));
                appendLog("TX", JSON.stringify(cmdObj));
            } catch (error) {
                console.error("Failed to send command:", error);
                appendLog("Error", "Failed to transmit command.");
            }
        }

        function syncTime() {
            const now = new Date();
            const timeArray = [
                now.getFullYear(),
                now.getMonth() + 1,
                now.getDate(),
                now.getHours(),
                now.getMinutes(),
                now.getSeconds()
            ];
            sendCommand({ c: 'SYNC', t: timeArray });
        }

        function appendLog(tag, text) {
            const container = document.getElementById('logsOutput');
            const div = document.createElement('div');
            div.className = "border-b border-slate-800/50 pb-1 mb-1";
            div.innerHTML = `<span class="text-cyan-400 font-bold">[${tag}]</span> <span class="text-slate-300">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('logsOutput').innerHTML = '<div class="text-slate-500">Console cleared.</div>';
            document.getElementById('configOutput').innerText = "No config loaded...";
            bleBuffer = "";
        }
    </script>
</body>
</html>
