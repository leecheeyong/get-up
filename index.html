<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSit Web Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; margin: 5px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .log-box { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; margin-top: 20px; }
        .status { margin-bottom: 20px; font-weight: bold; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>SmartSit Web Dashboard</h2>
    <div class="status" id="statusText">Status: <span class="disconnected">Disconnected</span></div>
    
    <button id="btnConnect">Connect to ESP32</button>
    <button id="btnSyncTime" disabled>Sync Time</button>
    <button id="btnGetConfig" disabled>Get Config</button>
    <button id="btnGetLogs" disabled>Get Logs</button>

    <div class="log-box" id="output">Waiting for data...<br></div>
</div>

<script>
    // UUIDs for the Nordic UART Service (NUS)
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // Web -> ESP32
    const TX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // ESP32 -> Web

    let bleDevice = null;
    let rxCharacteristic = null; // We write to this
    let txCharacteristic = null; // We read from this
    let receiveBuffer = ''; // Buffer to reassemble 20-byte chunks

    const uiOutput = document.getElementById('output');
    const statusText = document.getElementById('statusText');
    const btns = [document.getElementById('btnSyncTime'), document.getElementById('btnGetConfig'), document.getElementById('btnGetLogs')];

    function logToScreen(text, isError = false) {
        const span = document.createElement('span');
        span.style.color = isError ? '#ff4444' : '#00ff00';
        span.innerText = `> ${text}\n`;
        uiOutput.appendChild(span);
        uiOutput.scrollTop = uiOutput.scrollHeight;
    }

    document.getElementById('btnConnect').addEventListener('click', async () => {
        try {
            logToScreen("Requesting Bluetooth Device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [NUS_SERVICE_UUID] }], // Filter by service UUID instead of name
                optionalServices: [NUS_SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusText.innerHTML = 'Status: <span class="disconnected">Disconnected</span>';
                btns.forEach(b => b.disabled = true);
                logToScreen("Device disconnected.", true);
            });

            logToScreen(`Connecting to GATT Server...`);
            const server = await bleDevice.gatt.connect();

            logToScreen("Locating NUS Service...");
            const service = await server.getPrimaryService(NUS_SERVICE_UUID);

            logToScreen("Locating Characteristics...");
            rxCharacteristic = await service.getCharacteristic(RX_CHARACTERISTIC_UUID);
            txCharacteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);

            // IMPORTANT: Subscribe to notifications and add event listener
            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

            statusText.innerHTML = `Status: <span class="connected">Connected to ${bleDevice.name}</span>`;
            btns.forEach(b => b.disabled = false);
            logToScreen("Ready to send/receive!");

        } catch (error) {
            logToScreen("Connection failed: " + error, true);
        }
    });

    // --- Glue the 20-byte chunks together ---
    function handleIncomingData(event) {
        const decoder = new TextDecoder('utf-8');
        const chunk = decoder.decode(event.target.value);
        receiveBuffer += chunk;

        // Process whenever we find a newline character
        while (receiveBuffer.includes('\n')) {
            const splitIndex = receiveBuffer.indexOf('\n');
            const completeLine = receiveBuffer.substring(0, splitIndex).trim();
            receiveBuffer = receiveBuffer.substring(splitIndex + 1); // Keep the remainder

            if (completeLine) {
                try {
                    const jsonData = JSON.parse(completeLine);
                    logToScreen("RECEIVED: " + JSON.stringify(jsonData, null, 2));
                    
                    // You can add logic here based on the type of data
                    if (jsonData.type === "CFG") {
                        console.log("Config loaded:", jsonData.data);
                    } else if (jsonData.type === "LOGS") {
                        console.log("Logs loaded:", jsonData.data);
                    }
                } catch (e) {
                    logToScreen("Failed to parse JSON: " + completeLine, true);
                }
            }
        }
    }

    // --- Send data with guaranteed newline delimiter ---
    async function sendCommand(cmdObject) {
        if (!rxCharacteristic) return;
        
        // Ensure every command ends with \n so the ESP32 knows the line is done
        const jsonStr = JSON.stringify(cmdObject) + '\n';
        const encoder = new TextEncoder();
        const data = encoder.encode(jsonStr);

        try {
            await rxCharacteristic.writeValue(data);
            logToScreen("SENT: " + JSON.stringify(cmdObject));
        } catch (error) {
            logToScreen("Failed to send: " + error, true);
        }
    }

    // --- Button Actions ---
    document.getElementById('btnSyncTime').addEventListener('click', () => {
        const now = new Date();
        sendCommand({
            cmd: "SYNC_TIME",
            time: [
                now.getFullYear(), now.getMonth() + 1, now.getDate(),
                now.getHours(), now.getMinutes(), now.getSeconds()
            ]
        });
    });

    document.getElementById('btnGetConfig').addEventListener('click', () => {
        sendCommand({ cmd: "GET_CFG" });
    });

    document.getElementById('btnGetLogs').addEventListener('click', () => {
        sendCommand({ cmd: "GET_LOGS" });
    });
</script>

</body>
</html>
