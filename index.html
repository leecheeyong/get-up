<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSit Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
            --accent-cyan: #38bdf8;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(46, 160, 67, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: #ffffff;
        }

        .btn {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #30363d;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: #000000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="number"] {
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.75rem;
            color: #ffffff;
            font-size: 0.875rem;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        textarea {
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.75rem;
            color: #ffffff;
            font-size: 0.875rem;
            width: 100%;
            height: 100px;
            resize: vertical;
            font-family: monospace;
        }

        .action-row {
            display: flex;
            gap: 0.75rem;
        }

        .logs-container {
            max-height: 200px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.8125rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .log-item {
            color: var(--text-main);
            padding: 0.2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            transition: background-color 0.3s;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(46, 160, 67, 0.4);
        }

        .connection-status {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1>SmartSit Dashboard</h1>
                <div class="connection-status">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>
            <button id="connectBtn" class="btn btn-primary" onclick="toggleConnect()">Connect Device</button>
        </header>

        <!-- Metrics Overview -->
        <div class="card">
            <div class="card-title">Activity Overview</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <label>Compliance</label>
                    <div id="statCompliance" class="stat-value">0%</div>
                </div>
                <div class="stat-box">
                    <label>Acknowledged</label>
                    <div id="statAcc" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <label>Ignored</label>
                    <div id="statIgn" class="stat-value">0</div>
                </div>
            </div>
        </div>

        <!-- Configuration Panel -->
        <div class="card">
            <div class="card-title">Device Configuration</div>
            <div class="form-group">
                <label>Tasks (JSON Array format)</label>
                <textarea id="tasksInput">["WALK 2M", "DRINK WATER", "15 SQUATS", "STRETCH", "EYE EXERCISE"]</textarea>
            </div>
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="form-group">
                    <label>First Interval (m)</label>
                    <input type="number" id="firstIntervalInput" value="5">
                </div>
                <div class="form-group">
                    <label>Min Interval (m)</label>
                    <input type="number" id="minIntervalInput" value="10">
                </div>
                <div class="form-group">
                    <label>Max Interval (m)</label>
                    <input type="number" id="maxIntervalInput" value="30">
                </div>
            </div>
            <div class="action-row">
                <button class="btn btn-primary" onclick="saveConfig()">Save Config</button>
                <button class="btn" onclick="fetchConfig()">Fetch Config</button>
            </div>
        </div>

        <!-- Logs Panel -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="card-title" style="margin:0;">Activity Logs</div>
                <button class="btn" onclick="fetchLogs()">Fetch Logs</button>
            </div>
            <div id="logsContainer" class="logs-container">
                <div class="log-item" style="color: var(--text-muted);">No logs loaded yet. Connect and fetch to view.</div>
            </div>
        </div>
    </div>

    <script>
        // BLE UUIDs for Nordic UART Service (NUS)
        const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bleDevice = null;
        let bleCharacteristicRX = null;
        let bleCharacteristicTX = null;
        let rxBuffer = "";

        async function toggleConnect() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                onDisconnected();
                return;
            }

            try {
                console.log("Requesting Bluetooth Device...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "SmartSit" }],
                    optionalServices: [NUS_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                console.log("Connecting to GATT Server...");
                const server = await bleDevice.gatt.connect();

                console.log("Getting NUS Service...");
                const service = await server.getPrimaryService(NUS_SERVICE_UUID);

                console.log("Getting Characteristics...");
                bleCharacteristicRX = await service.getCharacteristic(NUS_RX_UUID);
                bleCharacteristicTX = await service.getCharacteristic(NUS_TX_UUID);

                await bleCharacteristicTX.startNotifications();
                bleCharacteristicTX.addEventListener('characteristicvaluechanged', handleNotification);

                onConnected();
                
                // Automatically sync time and fetch initial state on connection
                await syncTime();
                await fetchConfig();
                await fetchLogs();

            } catch (error) {
                console.error("Connection failed:", error);
                alert("Connection failed: " + error.message);
            }
        }

        function onConnected() {
            document.getElementById('statusDot').classList.add('connected');
            document.getElementById('statusText').innerText = "Connected";
            document.getElementById('connectBtn').innerText = "Disconnect";
            document.getElementById('connectBtn').style.background = "var(--accent-red)";
            document.getElementById('connectBtn').style.color = "#ffffff";
        }

        function onDisconnected() {
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('statusText').innerText = "Disconnected";
            document.getElementById('connectBtn').innerText = "Connect Device";
            document.getElementById('connectBtn').style.background = "var(--accent-cyan)";
            document.getElementById('connectBtn').style.color = "#000000";
            bleDevice = null;
            bleCharacteristicRX = null;
            bleCharacteristicTX = null;
        }

        // Chunk buffering handler for incoming data
        function handleNotification(event) {
            const value = event.target.value;
            const chunk = new TextDecoder().decode(value);
            rxBuffer += chunk;

            while (rxBuffer.includes('\n')) {
                const lineEnd = rxBuffer.indexOf('\n');
                const completeMessage = rxBuffer.slice(0, lineEnd).trim();
                rxBuffer = rxBuffer.slice(lineEnd + 1);

                if (completeMessage) {
                    try {
                        const parsed = JSON.parse(completeMessage);
                        handleDeviceMessage(parsed);
                    } catch (err) {
                        console.error("Failed to parse JSON:", completeMessage);
                    }
                }
            }
        }

        function handleDeviceMessage(msg) {
            console.log("<- Received:", msg);
            if (msg.type === "CFG") {
                populateConfigUI(msg.data);
            } else if (msg.type === "LOGS") {
                populateLogsUI(msg.data);
            } else if (msg.type === "ACK") {
                console.log("Command acknowledged by device.");
            }
        }

        async function sendCommand(cmdObject) {
            if (!bleCharacteristicRX) {
                alert("Device not connected!");
                return;
            }

            const payload = JSON.stringify(cmdObject) + "\n";
            const encoded = new TextEncoder().encode(payload);

            try {
                if (bleCharacteristicRX.properties.writeWithoutResponse) {
                    await bleCharacteristicRX.writeValueWithoutResponse(encoded);
                } else {
                    await bleCharacteristicRX.writeValueWithResponse(encoded);
                }
                console.log("-> Sent:", cmdObject);
            } catch (error) {
                console.error("Send failed:", error);
            }
        }

        async function syncTime() {
            const now = new Date();
            const timeArr = [
                now.getFullYear(),
                now.getMonth() + 1,
                now.getDate(),
                now.getHours(),
                now.getMinutes(),
                now.getSeconds()
            ];
            await sendCommand({ cmd: "SYNC_TIME", time: timeArr });
        }

        async function fetchConfig() {
            await sendCommand({ cmd: "GET_CFG" });
        }

        async function saveConfig() {
            try {
                const tasks = JSON.parse(document.getElementById('tasksInput').value);
                const first_interval = parseInt(document.getElementById('firstIntervalInput').value);
                const min_interval = parseInt(document.getElementById('minIntervalInput').value);
                const max_interval = parseInt(document.getElementById('maxIntervalInput').value);

                const cfgData = { tasks, first_interval, min_interval, max_interval };
                await sendCommand({ cmd: "SET_CFG", data: cfgData });
                alert("Configuration saved successfully!");
            } catch (e) {
                alert("Invalid Tasks JSON format. Please verify.");
            }
        }

        async function fetchLogs() {
            await sendCommand({ cmd: "GET_LOGS" });
        }

        function populateConfigUI(cfg) {
            if (cfg.tasks) {
                document.getElementById('tasksInput').value = JSON.stringify(cfg.tasks);
            }
            if (cfg.first_interval !== undefined) {
                document.getElementById('firstIntervalInput').value = cfg.first_interval;
            }
            if (cfg.min_interval !== undefined) {
                document.getElementById('minIntervalInput').value = cfg.min_interval;
            }
            if (cfg.max_interval !== undefined) {
                document.getElementById('maxIntervalInput').value = cfg.max_interval;
            }
        }

        function populateLogsUI(data) {
            const container = document.getElementById('logsContainer');
            container.innerHTML = "";

            if (data.stats) {
                const acc = data.stats.acc || 0;
                const ign = data.stats.ign || 0;
                const total = acc + ign;
                const comp = total > 0 ? Math.round((acc / total) * 100) : 0;

                document.getElementById('statCompliance').innerText = comp + "%";
                document.getElementById('statAcc').innerText = acc;
                document.getElementById('statIgn').innerText = ign;
            }

            if (data.logs && data.logs.length > 0) {
                data.logs.slice().reverse().forEach(log => {
                    const div = document.createElement('div');
                    div.className = 'log-item';
                    div.innerText = `[${log.ts}] Type: ${log.type} ${log.task ? '| Task: ' + log.task + ' (' + log.out + ')' : ''} ${log.duration ? '| Duration: ' + Math.round(log.duration/60) + 'm' : ''}`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = `<div class="log-item" style="color: var(--text-muted);">No log entries recorded yet.</div>`;
            }
        }
    </script>
</body>
</html>
