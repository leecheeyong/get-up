<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSit Tracker Dashboard</title>
    <!-- Tailwind CSS CDN for modern layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(24, 30, 45, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            border-color: #06b6d4;
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse" id="status-dot"></div>
                <h1 class="text-xl font-bold tracking-tight text-white">SmartSit <span class="text-cyan-400 font-light">Dashboard</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="connection-status" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Disconnected</span>
                <button id="connect-btn" onclick="toggleConnection()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-5 py-2 rounded-xl text-sm transition-all shadow-lg shadow-cyan-500/20 active:scale-95">
                    Connect Device
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Left Column: Metrics & Quick Actions -->
        <div class="space-y-6">
            <!-- Stats Card -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Device Statistics</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                        <p class="text-xs text-slate-400">Accepted</p>
                        <p id="stat-acc" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
                    </div>
                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                        <p class="text-xs text-slate-400">Ignored</p>
                        <p id="stat-ign" class="text-2xl font-bold text-rose-400 mt-1">0</p>
                    </div>
                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800 col-span-2">
                        <p class="text-xs text-slate-400">Focus Time Logged</p>
                        <p id="stat-focus" class="text-2xl font-bold text-cyan-400 mt-1">0 <span class="text-xs font-normal text-slate-400">mins</span></p>
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-800 flex gap-2">
                    <button onclick="fetchData()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 rounded-lg transition-colors border border-slate-700">Refresh Data</button>
                    <button onclick="syncTime()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-medium py-2 rounded-lg transition-colors border border-slate-700">Sync Time</button>
                </div>
            </div>

            <!-- Intervals Config Card -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Prompt Intervals (Mins)</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">First Interval</label>
                        <input type="number" id="cfg-first" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-slate-200">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Min Interval</label>
                            <input type="number" id="cfg-min" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-slate-200">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Max Interval</label>
                            <input type="number" id="cfg-max" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-slate-200">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Task Management & Activity Logs -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Tasks Editor Card -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Configured Tasks</h2>
                    <button onclick="saveConfiguration()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-4 py-1.5 rounded-xl text-xs transition-all shadow-md shadow-emerald-500/10">Save Configuration</button>
                </div>
                <div id="tasks-container" class="space-y-2 mb-4">
                    <!-- Dynamic Task Inputs get injected here -->
                </div>
                <div class="flex gap-2">
                    <input type="text" id="new-task-input" placeholder="Add new task (e.g. STRETCH ARMS)" class="glass-input flex-1 px-3 py-2 rounded-xl text-sm text-slate-200 uppercase">
                    <button onclick="addNewTaskInput()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-xl border border-slate-700 transition-colors">+ Add</button>
                </div>
            </div>

            <!-- Activity Logs Table Card -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Recent Event Logs</h2>
                <div class="overflow-x-auto max-h-64 overflow-y-auto pr-1">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="text-slate-400 uppercase border-b border-slate-800 sticky top-0 bg-slate-900/90 backdrop-blur-sm">
                            <tr>
                                <th class="py-2 px-3">Timestamp</th>
                                <th class="py-2 px-3">Type</th>
                                <th class="py-2 px-3">Details</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="divide-y divide-slate-800/60">
                            <tr>
                                <td colspan="3" class="py-4 text-center text-slate-500">No logs loaded yet. Connect device and click Refresh.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Web Bluetooth Logic -->
    <script>
        const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice = null;
        let gattServer = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let rxBuffer = "";
        let currentConfig = { tasks: [], first_interval: 5, min_interval: 10, max_interval: 30 };

        async function toggleConnection() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                await bluetoothDevice.gatt.disconnect();
                updateConnectionState(false);
            } else {
                try {
                    const btn = document.getElementById("connect-btn");
                    btn.textContent = "Scanning...";
                    
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ services: [NUS_SERVICE_UUID] }]
                    });

                    bluetoothDevice.addEventListener('gattserverdisconnected', () => updateConnectionState(false));

                    gattServer = await bluetoothDevice.gatt.connect();
                    const service = await gattServer.getPrimaryService(NUS_SERVICE_UUID);
                    
                    rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
                    txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

                    await txCharacteristic.startNotifications();
                    txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingNotification);

                    updateConnectionState(true);
                    
                    // Auto fetch initial data on connect
                    setTimeout(fetchData, 500);
                } catch (error) {
                    console.error("Connection failed:", error);
                    alert("Bluetooth connection failed or was cancelled.");
                    updateConnectionState(false);
                }
            }
        }

        function updateConnectionState(isConnected) {
            const statusBadge = document.getElementById("connection-status");
            const statusDot = document.getElementById("status-dot");
            const connectBtn = document.getElementById("connect-btn");

            if (isConnected) {
                statusBadge.textContent = "Connected";
                statusBadge.className = "text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-none";
                connectBtn.textContent = "Disconnect";
                connectBtn.className = "bg-rose-500 hover:bg-rose-400 text-slate-950 font-semibold px-5 py-2 rounded-xl text-sm transition-all shadow-lg shadow-rose-500/20 active:scale-95";
            } else {
                statusBadge.textContent = "Disconnected";
                statusBadge.className = "text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
                statusDot.className = "w-3 h-3 rounded-full bg-slate-600 animate-pulse";
                connectBtn.textContent = "Connect Device";
                connectBtn.className = "bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-5 py-2 rounded-xl text-sm transition-all shadow-lg shadow-cyan-500/20 active:scale-95";
            }
        }

        function handleIncomingNotification(event) {
            const decoder = new TextDecoder();
            const chunk = decoder.decode(event.target.value);
            rxBuffer += chunk;

            let newlineIdx;
            while ((newlineIdx = rxBuffer.indexOf('\n')) !== -1) {
                const jsonStr = rxBuffer.substring(0, newlineIdx);
                rxBuffer = rxBuffer.substring(newlineIdx + 1);
                try {
                    const packet = JSON.parse(jsonStr);
                    processPacket(packet);
                } catch (e) {
                    console.error("JSON parse error:", e, "on string:", jsonStr);
                }
            }
        }

        function processPacket(packet) {
            console.log("<- Received from ESP32:", packet);
            if (packet.type === "LOGS") {
                updateStatsUI(packet.data.stats);
                updateLogsTable(packet.data.logs);
            } else if (packet.type === "CFG") {
                currentConfig = packet.data;
                populateConfigUI(packet.data);
            } else if (packet.type === "ACK") {
                alert("Action acknowledged/saved successfully by ESP32!");
                fetchData();
            }
        }

        async function sendCommand(cmdObj) {
            if (!rxCharacteristic) {
                alert("Device not connected!");
                return;
            }
            const encoder = new TextEncoder();
            const jsonStr = JSON.stringify(cmdObj) + "\n";
            const data = encoder.encode(jsonStr);
            
            try {
                // FIX: Manually chunk data into 20 bytes to prevent Web Bluetooth truncation
                const CHUNK_SIZE = 20;
                for (let i = 0; i < data.length; i += CHUNK_SIZE) {
                    const chunk = data.slice(i, i + CHUNK_SIZE);
                    await rxCharacteristic.writeValue(chunk);
                    // 20ms delay gives the ESP32 time to read and append the chunk to its buffer
                    await new Promise(r => setTimeout(r, 20)); 
                }
                console.log("-> Sent:", cmdObj);
            } catch (e) {
                console.error("Failed to send command:", e);
            }
        }

        function fetchData() {
            sendCommand({ cmd: "GET_LOGS" });
            setTimeout(() => sendCommand({ cmd: "GET_CFG" }), 200);
        }

        function syncTime() {
            const now = new Date();
            const timeArr = [
                now.getFullYear(),
                now.getMonth() + 1,
                now.getDate(),
                now.getHours(),
                now.getMinutes(),
                now.getSeconds()
            ];
            sendCommand({ cmd: "SYNC_TIME", time: timeArr });
        }

        function updateStatsUI(stats) {
            document.getElementById("stat-acc").textContent = stats.acc || 0;
            document.getElementById("stat-ign").textContent = stats.ign || 0;
            document.getElementById("stat-focus").innerHTML = `${stats.focus_m || 0} <span class="text-xs font-normal text-slate-400">mins</span>`;
        }

        function updateLogsTable(logs) {
            const tbody = document.getElementById("logs-table-body");
            tbody.innerHTML = "";
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">No logs recorded yet.</td></tr>`;
                return;
            }
            // Reverse chronological order
            logs.slice().reverse().forEach(log => {
                const tr = document.createElement("tr");
                tr.className = "border-b border-slate-800/40 hover:bg-slate-900/30";
                
                let detailsStr = "";
                for (const [k, v] of Object.entries(log)) {
                    if (k !== 'ts' && k !== 'type') {
                        detailsStr += `<span class="opacity-70">${k}:</span> <strong class="text-slate-200">${v}</strong> `;
                    }
                }

                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-slate-400">${log.ts}</td>
                    <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${log.type === 'TASK' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'}">${log.type}</span></td>
                    <td class="py-2.5 px-3">${detailsStr}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function populateConfigUI(cfg) {
            document.getElementById("cfg-first").value = cfg.first_interval;
            document.getElementById("cfg-min").value = cfg.min_interval;
            document.getElementById("cfg-max").value = cfg.max_interval;

            const container = document.getElementById("tasks-container");
            container.innerHTML = "";
            cfg.tasks.forEach((task, idx) => {
                addTaskRow(task, idx);
            });
        }

        function addTaskRow(taskValue = "", index = null) {
            const container = document.getElementById("tasks-container");
            const div = document.createElement("div");
            div.className = "flex gap-2 task-row";
            div.innerHTML = `
                <input type="text" value="${taskValue}" class="glass-input flex-1 px-3 py-2 rounded-xl text-sm text-slate-200 uppercase task-input">
                <button onclick="this.parentElement.remove()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 rounded-xl transition-colors">Remove</button>
            `;
            container.appendChild(div);
        }

        function addNewTaskInput() {
            const val = document.getElementById("new-task-input").value.trim();
            if (val) {
                addTaskRow(val.toUpperCase());
                document.getElementById("new-task-input").value = "";
            }
        }

        function saveConfiguration() {
            const taskInputs = document.querySelectorAll(".task-input");
            const tasks = Array.from(taskInputs).map(input => input.value.trim().toUpperCase()).filter(Boolean);
            
            const updatedCfg = {
                tasks: tasks.length > 0 ? tasks : currentConfig.tasks,
                first_interval: parseInt(document.getElementById("cfg-first").value) || 5,
                min_interval: parseInt(document.getElementById("cfg-min").value) || 10,
                max_interval: parseInt(document.getElementById("cfg-max").value) || 30
            };

            sendCommand({ cmd: "SET_CFG", data: updatedCfg });
        }
    </script>
</body>
</html>
