<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSit Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Glass Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent);
            border-color: transparent;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        /* Stats & Content */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .config-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .config-label { color: var(--text-muted); }
        .config-val { font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }

        .logs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .logs-list::-webkit-scrollbar { width: 4px; }
        .logs-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .log-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .log-info { display: flex; flex-direction: column; gap: 2px; }
        .log-time { font-size: 11px; color: var(--text-muted); }
        .log-type { font-weight: 600; }
        
        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        .tag.ACC { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .tag.IGN { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .tag.FOCUS { background: rgba(59, 130, 246, 0.15); color: var(--accent); }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header & Connection -->
    <div class="card header">
        <div>
            <div class="title">SmartSit Tracker</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;" id="deviceSub">Not connected</div>
        </div>
        <div class="status-badge" id="statusBadge">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Offline</span>
        </div>
    </div>

    <button class="btn btn-primary" id="btnConnect">Connect Device</button>

    <!-- Controls -->
    <div class="card" style="opacity: 0.4; pointer-events: none;" id="controlsCard">
        <div class="section-title">Device Actions</div>
        <button class="btn" id="btnSyncTime">Sync Current Time</button>
        <div class="action-grid">
            <button class="btn" id="btnGetConfig">Fetch Config</button>
            <button class="btn" id="btnGetLogs">Fetch Logs</button>
        </div>
    </div>

    <!-- Configuration Card -->
    <div class="card" style="opacity: 0.4; pointer-events: none;" id="configCard">
        <div class="section-title">Device Configuration</div>
        <div class="config-details">
            <div class="config-row">
                <span class="config-label">Tasks</span>
                <span class="config-val" id="valTasks">Not loaded</span>
            </div>
            <div class="config-row">
                <span class="config-label">First Interval</span>
                <span class="config-val" id="valFirst">-- mins</span>
            </div>
            <div class="config-row">
                <span class="config-label">Random Range</span>
                <span class="config-val" id="valRange">-- to -- mins</span>
            </div>
        </div>
    </div>

    <!-- Logs Card -->
    <div class="card" style="opacity: 0.4; pointer-events: none;" id="logsCard">
        <div class="section-title">Activity Feed</div>
        <div class="logs-list" id="logsContainer">
            <div class="empty-state">No logs loaded yet. Click "Fetch Logs".</div>
        </div>
    </div>
</div>

<script>
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let receiveBuffer = '';
    
    let commandQueue = [];
    let isWriting = false;

    const btnConnect = document.getElementById('btnConnect');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const deviceSub = document.getElementById('deviceSub');
    const controlsCard = document.getElementById('controlsCard');
    const configCard = document.getElementById('configCard');
    const logsCard = document.getElementById('logsCard');
    const logsContainer = document.getElementById('logsContainer');

    btnConnect.addEventListener('click', async () => {
        if (bleDevice && bleDevice.gatt.connected) {
            bleDevice.gatt.disconnect();
            onDisconnected();
            return;
        }

        try {
            statusText.innerText = "Connecting...";
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [NUS_SERVICE_UUID] }],
                optionalServices: [NUS_SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(NUS_SERVICE_UUID);
            
            rxCharacteristic = await service.getCharacteristic(RX_UUID);
            txCharacteristic = await service.getCharacteristic(TX_UUID);

            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

            // Update UI
            statusDot.classList.add('connected');
            statusText.innerText = "Connected";
            deviceSub.innerText = bleDevice.name || "SmartSit-Tracker";
            btnConnect.innerText = "Disconnect";
            btnConnect.classList.add('btn-danger');
            
            controlsCard.style.opacity = "1";
            controlsCard.style.pointerEvents = "auto";
            configCard.style.opacity = "1";
            configCard.style.pointerEvents = "auto";
            logsCard.style.opacity = "1";
            logsCard.style.pointerEvents = "auto";

            // Safely sequence initial sync
            queueCommand({ cmd: "SYNC_TIME", time: getFormattedTime() });
            setTimeout(() => queueCommand({ cmd: "GET_CFG" }), 600);
            setTimeout(() => queueCommand({ cmd: "GET_LOGS" }), 1200);

        } catch (error) {
            console.error(error);
            statusText.innerText = "Failed";
            statusDot.classList.remove('connected');
        }
    });

    function onDisconnected() {
        statusDot.classList.remove('connected');
        statusText.innerText = "Offline";
        deviceSub.innerText = "Not connected";
        btnConnect.innerText = "Connect Device";
        btnConnect.classList.remove('btn-danger');
        controlsCard.style.opacity = "0.4";
        controlsCard.style.pointerEvents = "none";
        configCard.style.opacity = "0.4";
        controlsCard.style.pointerEvents = "none";
        logsCard.style.opacity = "0.4";
        logsCard.style.pointerEvents = "none";
    }

    function getFormattedTime() {
        const now = new Date();
        return [
            now.getFullYear(), now.getMonth() + 1, now.getDate(),
            now.getHours(), now.getMinutes(), now.getSeconds()
        ];
    }

    function queueCommand(cmdObject) {
        commandQueue.push(cmdObject);
        processQueue();
    }

    async function processQueue() {
        if (isWriting || commandQueue.length === 0 || !rxCharacteristic) return;
        isWriting = true;
        const cmdObject = commandQueue.shift();
        try {
            const jsonStr = JSON.stringify(cmdObject) + '\n';
            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(jsonStr));
            await new Promise(r => setTimeout(r, 400));
        } catch (err) {
            console.error("Write error:", err);
        } finally {
            isWriting = false;
            processQueue();
        }
    }

    // --- Ultra-Forgiving Universal Parser ---
    function handleIncomingData(event) {
        const decoder = new TextDecoder('utf-8');
        const chunk = decoder.decode(event.target.value);
        receiveBuffer += chunk;

        console.log("Raw BLE chunk:", chunk); // Check browser console (F12) to see raw packets

        // Process line-by-line if newline exists, or try parsing the whole buffer if it forms complete JSON
        if (receiveBuffer.includes('\n')) {
            const lines = receiveBuffer.split('\n');
            receiveBuffer = lines.pop(); // Keep leftover fragment
            for (let line of lines) {
                if (line.trim()) tryParseAndRoute(line.trim());
            }
        } else {
            // Fallback for ESP32 streams without newlines
            const trimmed = receiveBuffer.trim();
            if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                if (tryParseAndRoute(trimmed)) {
                    receiveBuffer = ''; // Clear buffer on success
                }
            }
        }
    }

    function tryParseAndRoute(jsonStr) {
        try {
            const res = JSON.parse(jsonStr);
            console.log("Parsed JSON Object:", res);

            // Handle different possible key structures from ESP32
            if (res.type === "LOGS" && res.data) {
                renderLogs(res.data);
            } else if (res.logs) {
                renderLogs(res);
            } else if (res.type === "CFG" && res.data) {
                renderConfig(res.data);
            } else if (res.tasks || res.first_interval !== undefined || res.min_interval !== undefined) {
                renderConfig(res);
            }
            return true;
        } catch (e) {
            return false;
        }
    }

    function renderConfig(cfg) {
        if (!cfg) return;
        document.getElementById('valTasks').innerText = cfg.tasks ? cfg.tasks.join(", ") : "None";
        document.getElementById('valFirst').innerText = (cfg.first_interval !== undefined ? cfg.first_interval : 5) + " mins";
        document.getElementById('valRange').innerText = `${cfg.min_interval !== undefined ? cfg.min_interval : 10} to ${cfg.max_interval !== undefined ? cfg.max_interval : 30} mins`;
    }

    function renderLogs(data) {
        const logs = data.logs || data;
        if (!Array.isArray(logs) || logs.length === 0) {
            logsContainer.innerHTML = `<div class="empty-state">No recorded activity found.</div>`;
            return;
        }

        logsContainer.innerHTML = '';
        logs.slice().reverse().forEach(log => {
            const item = document.createElement('div');
            item.className = 'log-item';
            
            let tagClass = log.out || log.type || "ACC";
            let label = log.task || log.type || "Activity";
            if (log.type === "FOCUS") label = `Focus (${log.duration ? Math.round(log.duration/60) : 0}m)`;

            item.innerHTML = `
                <div class="log-info">
                    <span class="log-type">${label}</span>
                    <span class="log-time">${log.ts || "Unknown time"}</span>
                </div>
                <span class="tag ${tagClass}">${tagClass}</span>
            `;
            logsContainer.appendChild(item);
        });
    }

    // Button Listeners
    document.getElementById('btnSyncTime').addEventListener('click', () => {
        queueCommand({ cmd: "SYNC_TIME", time: getFormattedTime() });
        alert("Time synced successfully!");
    });

    document.getElementById('btnGetConfig').addEventListener('click', () => {
        queueCommand({ cmd: "GET_CFG" });
    });

    document.getElementById('btnGetLogs').addEventListener('click', () => {
        queueCommand({ cmd: "GET_LOGS" });
    });
</script>

</body>
</html>
