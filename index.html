<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tracker Control Panel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .dot.connected {
            background-color: #22c55e;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #2563eb;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .actions-grid button {
            margin-bottom: 0;
        }
        textarea {
            width: 100%;
            height: 250px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Tracker Dashboard</h1>
        
        <div class="status-box">
            <div>
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
            <span id="deviceIdentifier" style="font-size: 0.85rem; color: #94a3b8;">No Device</span>
        </div>

        <button id="connectBtn" onclick="toggleConnection()">Connect Bluetooth Device</button>

        <div class="actions-grid">
            <button id="refreshLogsBtn" onclick="requestLogs()" disabled>Refresh Logs</button>
            <button id="getSysCfgBtn" onclick="requestConfig()" disabled>Get Config</button>
            <button id="syncTimeBtn" onclick="syncTime()" disabled>Sync Current Time</button>
            <button id="clearLogBtn" onclick="clearOutput()" style="background-color: #64748b;">Clear View</button>
        </div>

        <h3>Data / Log Feed:</h3>
        <textarea id="outputArea" readonly placeholder="Device output will appear here..."></textarea>
    </div>

    <script>
        let bluetoothDevice = null;
        let bluetoothServer = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let incomingBuffer = "";

        const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_TX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        function logToScreen(text) {
            const output = document.getElementById('outputArea');
            output.value += text + "\n";
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('outputArea').value = "";
        }

        async function toggleConnection() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                await disconnectDevice();
            } else {
                await connectDevice();
            }
        }

        async function connectDevice() {
            try {
                logToScreen("Requesting Bluetooth Device...");
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [NUS_SERVICE_UUID] }]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                logToScreen("Connecting to GATT Server...");
                bluetoothServer = await bluetoothDevice.gatt.connect();

                logToScreen("Getting Primary Service...");
                const service = await bluetoothServer.getPrimaryService(NUS_SERVICE_UUID);

                logToScreen("Getting Characteristics...");
                rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
                txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

                // CRITICAL: Must re-enable notifications on every fresh connection session
                logToScreen("Starting Notifications...");
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                updateUIConnected(true);
                logToScreen("Successfully Connected & Subscribed!");

            } catch (error) {
                logToScreen("Connection Error: " + error);
                console.error(error);
                updateUIConnected(false);
            }
        }

        async function disconnectDevice() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                await bluetoothDevice.gatt.disconnect();
            }
            onDisconnected();
        }

        function onDisconnected() {
            logToScreen("Device Disconnected.");
            updateUIConnected(false);
            bluetoothDevice = null;
            bluetoothServer = null;
            rxCharacteristic = null;
            txCharacteristic = null;
        }

        function updateUIConnected(isConnected) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const devId = document.getElementById('deviceIdentifier');

            const actionBtns = ['refreshLogsBtn', 'getSysCfgBtn', 'syncTimeBtn'];

            if (isConnected) {
                dot.classList.add('connected');
                statusText.innerText = "Connected";
                connectBtn.innerText = "Disconnect Device";
                connectBtn.style.backgroundColor = "#ef4444";
                devId.innerText = bluetoothDevice.name || "ESP32 Device";
                
                actionBtns.forEach(id => document.getElementById(id).disabled = false);
            } else {
                dot.classList.remove('connected');
                statusText.innerText = "Disconnected";
                connectBtn.innerText = "Connect Bluetooth Device";
                connectBtn.style.backgroundColor = "#3b82f6";
                devId.innerText = "No Device";

                actionBtns.forEach(id => document.getElementById(id).disabled = true);
            }
        }

        function handleIncomingData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const chunk = decoder.decode(value);
            
            incomingBuffer += chunk;
            
            // Process complete lines delimited by newline (\n)
            let newlineIndex;
            while ((newlineIndex = incomingBuffer.indexOf('\n')) !== -1) {
                const line = incomingBuffer.slice(0, newlineIndex).trim();
                incomingBuffer = incomingBuffer.slice(newlineIndex + 1);
                
                if (line.length > 0) {
                    try {
                        const parsedJSON = JSON.parse(line);
                        logToScreen("<- Received Response: " + JSON.stringify(parsedJSON, null, 2));
                    } catch (e) {
                        logToScreen("<- Raw Data: " + line);
                    }
                }
            }
        }

        async function sendCommand(commandObj) {
            if (!rxCharacteristic) {
                alert("Device not connected!");
                return;
            }
            try {
                const jsonString = JSON.stringify(commandObj) + "\n";
                const encoder = new TextEncoder();
                const encodedData = encoder.encode(jsonString);

                // Send chunks of max 20 bytes if required, or write directly
                const chunkSize = 20;
                for (let i = 0; i < encodedData.length; i += chunkSize) {
                    const chunk = encodedData.slice(i, i + chunkSize);
                    await rxCharacteristic.writeValueWithoutResponse(chunk);
                }
                logToScreen("-> Sent Command: " + JSON.stringify(commandObj));
            } catch (error) {
                logToScreen("Send Error: " + error);
                console.error(error);
            }
        }

        function requestLogs() {
            sendCommand({ cmd: "GET_LOGS" });
        }

        function requestConfig() {
            sendCommand({ cmd: "GET_CFG" });
        }

        function syncTime() {
            const now = new Date();
            const timeArray = [
                now.getFullYear(),
                now.getMonth() + 1,
                now.getDate(),
                now.getHours(),
                now.getMinutes(),
                now.getSeconds()
            ];
            sendCommand({ cmd: "SYNC_TIME", time: timeArray });
        }
    </script>
</body>
</html>
